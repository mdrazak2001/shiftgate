[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shiftgate"
version = "0.1.1"
description = "Intelligent routing layer that automatically selects the right LoRA adapter for each task in your local agent loop."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shiftgate contributors" }]
keywords = ["llm", "lora", "routing", "adapters", "inference", "ollama", "vllm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "fastembed>=0.3.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
shiftgate = "shiftgate.cli:app"

[project.urls]
Homepage = "https://github.com/shiftgate-ai/shiftgate"
Repository = "https://github.com/shiftgate-ai/shiftgate"
Issues = "https://github.com/shiftgate-ai/shiftgate/issues"

[tool.hatch.build.targets.wheel]
packages = ["shiftgate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
